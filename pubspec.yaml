name: almanac
description: "Your body, forecast daily. A privacy-first AI health companion for Health Connect data."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  health: ^13.3.2
  http: ^1.2.2
  path_provider: ^2.1.4
  flutter_secure_storage: ^10.0.0
  google_fonts: ">=6.2.1 <9.0.0"
  share_plus: ">=11.0.0 <14.0.0"
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <8.0.0"

flutter:
  uses-material-design: true
