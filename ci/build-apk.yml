# GitHub Actions workflow that builds a release APK on every push to main.
# To enable it, move this file to .github/workflows/build-apk.yml
# (GitHub web UI: open this file > Edit > change the path > Commit).
name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders, patch, render icons
        run: bash tool/bootstrap.sh

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk almanac.apk

      - uses: actions/upload-artifact@v4
        with:
          name: almanac-apk
          path: almanac.apk

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: almanac.apk

      - name: Publish rolling build from main
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Almanac (latest main build)
          prerelease: true
          files: almanac.apk
          body: Built automatically from the latest commit on main. Install almanac.apk on an Android 8+ phone with Health Connect.
