# Almanac: push a tag like v1.0.0 to publish a versioned release with the APK and an AAB.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0). Created from main if it does not exist.'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow (icon renderer)
        run: python -m pip install --upgrade pillow

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap (platform folders, patches, icons, pub get)
        run: bash tool/bootstrap.sh

      - name: Tests
        run: flutter test

      - name: Work out version from tag
        id: ver
        run: |
          NAME="${TAG#v}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build APK + App Bundle
        run: |
          flutter build apk --release --build-name=${{ steps.ver.outputs.name }} --build-number=${{ github.run_number }}
          flutter build appbundle --release --build-name=${{ steps.ver.outputs.name }} --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk "almanac-$TAG.apk"
          cp build/app/outputs/bundle/release/app-release.aab "almanac-$TAG.aab"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "almanac-$TAG.apk" "almanac-$TAG.aab" \
            --title "Almanac $TAG" \
            --generate-notes \
            --target "$GITHUB_SHA"
