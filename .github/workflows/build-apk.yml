# Almanac: build + test on every push/PR, and keep a rolling "nightly" APK release from main.
name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow (icon renderer)
        run: python -m pip install --upgrade pillow

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Bootstrap (platform folders, patches, icons, pub get)
        run: bash tool/bootstrap.sh

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk almanac.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: almanac-apk
          path: almanac.apk
          retention-days: 14

      - name: Publish rolling "nightly" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly almanac.apk \
            --title "Almanac (latest main build)" \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u +'%Y-%m-%d %H:%M UTC'). Install almanac.apk on an Android 8+ phone with Health Connect." \
            --prerelease \
            --target "$GITHUB_SHA"
